# Base de datos de DESARROLLO: PostgreSQL 16 + PostGIS 3.4.
# La imagen crea la extensión postgis en la base "ascensores" al inicializarse.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mant-asc-db
    environment:
      POSTGRES_USER: ascensores
      POSTGRES_PASSWORD: ascensores_dev
      POSTGRES_DB: ascensores
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP (-h 127.0.0.1): durante la inicialización la imagen levanta un servidor
      # temporal sólo por socket, así que esto recién da OK con el servidor definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ascensores -d ascensores"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
